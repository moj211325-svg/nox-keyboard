<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>کیبورد NOX</title>
    <style>
        body { background: #1A1A1A; color: white; font-family: monospace; margin: 0; padding: 10px; display: flex; flex-direction: column; height: 100vh; }
        #output { background: #202020; border: 1px solid #333; color: #8BC34A; padding: 10px; border-radius: 8px; font-size: 18px; min-height: 60px; margin-bottom: 5px; text-align: center; }
        #translation { background: #202020; border: 1px solid #333; color: #fff; padding: 10px; border-radius: 8px; font-size: 14px; min-height: 40px; margin-bottom: 15px; text-align: center; }
        .row { display: flex; justify-content: center; margin-bottom: 4px; }
        .key { background: #2A2A2A; border: 1px solid #3D3D3D; color: white; border-radius: 8px; margin: 2px; padding: 12px 0; text-align: center; flex: 1; font-size: 20px; user-select: none; -webkit-tap-highlight-color: transparent; }
        .key:active { background: #4A4A4A; }
        .key-small { font-size: 12px; color: #B0B0B0; display: block; margin-top: 2px; }
        .action-key { background: #3A3A3A; font-size: 14px; font-weight: bold; }
    </style>
</head>
<body>
    <div id="output"></div>
    <div id="translation">ترجمه:</div>
    <div id="keyboard"></div>

    <script>
        const alphabet = [
            {p:"ا", n:"⌁"}, {p:"ب", n:"⊏"}, {p:"پ", n:"⊏˙"}, {p:"ت", n:"⊐"},
            {p:"ث", n:"⊐˙"}, {p:"ج", n:"⋔"}, {p:"چ", n:"⋔˙"}, {p:"ح", n:"⊓"},
            {p:"خ", n:"⊓˙"}, {p:"د", n:"⌟"}, {p:"ذ", n:"⌟˙"}, {p:"ر", n:"⟆"},
            {p:"ز", n:"⟆˙"}, {p:"ژ", n:"⟆̈"}, {p:"س", n:"⋏"}, {p:"ش", n:"⋏˙"},
            {p:"ص", n:"⊔"}, {p:"ض", n:"⊔˙"}, {p:"ط", n:"⊙"}, {p:"ظ", n:"⊙˙"},
            {p:"ع", n:"⋎"}, {p:"غ", n:"⋎˙"}, {p:"ف", n:"⋒"}, {p:"ق", n:"⋒˙"},
            {p:"ک", n:"⋉"}, {p:"گ", n:"⋉˙"}, {p:"ل", n:"⌜"}, {p:"م", n:"⌒"},
            {p:"ن", n:"⌒˙"}, {p:"و", n:"∪"}, {p:"ه", n:"∩"}, {p:"ی", n:"⋊"}
        ];
        const map = {};
        alphabet.forEach(k => map[k.p] = k.n);
        const revMap = {};
        alphabet.forEach(k => revMap[k.n] = k.p);

        let noxText = "";
        let faText = "";

        function update() {
            document.getElementById('output').innerText = noxText || " ";
            document.getElementById('translation').innerText = faText ? "ترجمه: " + faText : "ترجمه:";
        }

        function addChar(nox, fa) {
            noxText += nox;
            faText += fa;
            update();
        }

        function backspace() {
            noxText = noxText.slice(0, -1);
            faText = faText.slice(0, -1);
            update();
        }

        function clearAll() {
            noxText = "";
            faText = "";
            update();
        }

        const rows = [
            ["۱","۲","۳","۴","۵","۶","۷","۸","۹","۰"],
            ["ص","ث","ق","ف","ع","ه","خ","ح","ج","چ"],
            ["ش","س","ی","ب","ل","ا","ت","ن","م","پ"],
            ["ط","ز","ر","د","و","ک","گ","⌫"]
        ];

        const kb = document.getElementById('keyboard');
        rows.forEach(row => {
            const div = document.createElement('div');
            div.className = 'row';
            row.forEach(key => {
                const btn = document.createElement('div');
                btn.className = key === "⌫" ? "key action-key" : "key";
                if (key === "⌫") {
                    btn.innerText = "⌫";
                    btn.onclick = backspace;
                } else {
                    const nox = map[key] || key;
                    btn.innerHTML = `${nox}<span class="key-small">${key}</span>`;
                    btn.onclick = () => addChar(nox, key);
                }
                div.appendChild(btn);
            });
            kb.appendChild(div);
        });

        const actionRow = document.createElement('div');
        actionRow.className = 'row';
        ["کپی", "Space", "پیست", "↵"].forEach(action => {
            const btn = document.createElement('div');
            btn.className = "key action-key";
            btn.style.flex = action === "Space" ? "2" : "1";
            btn.innerText = action;
            btn.onclick = () => {
                if (action === "Space") addChar(" ", " ");
                else if (action === "↵") clearAll();
                else if (action === "کپی") {
                    navigator.clipboard.writeText(noxText);
                    alert("کپی شد!");
                } else if (action === "پیست") {
                    navigator.clipboard.readText().then(text => {
                        for (let char of text) {
                            if (revMap[char]) {
                                noxText += char;
                                faText += revMap[char];
                            } else {
                                noxText += char;
                                faText += char;
                            }
                        }
                        update();
                    });
                }
            };
            actionRow.appendChild(btn);
        });
        kb.appendChild(actionRow);
    </script>
</body>
</html>
